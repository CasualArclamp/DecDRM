# Linux build and test. Manual trigger only (Actions → "Linux" → Run workflow, or
# `gh workflow run linux.yml`), so pushes do not use Actions minutes.
name: Linux

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: System packages (ALSA headers for cpal, CMake for libopus; Xvfb and Mesa for the GUI smoke test)
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libasound2-dev pkg-config cmake xvfb xauth libgl1-mesa-dri libegl1 libxkbcommon-x11-0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release --all-targets
      - name: Test
        run: cargo test --workspace --release
      - name: Clippy
        run: cargo clippy --workspace --release --all-targets -- -D clippy::correctness
      - name: Smoke test (device listing without a sound card, CLI transmit → receive, GUI under Xvfb)
        run: |
          set -eux
          ./target/release/decdrm devices
          ./target/release/decdrm tx crates/decdrm-station/examples/station.toml --duration 20 --output "$RUNNER_TEMP/drm.wav"
          ./target/release/decdrm rx "$RUNNER_TEMP/drm.wav" --data-dir "$RUNNER_TEMP/data" | tee "$RUNNER_TEMP/rx.txt"
          grep -E "audio .*: [1-9][0-9]* frames ok, 0 concealed" "$RUNNER_TEMP/rx.txt"
          ls -R "$RUNNER_TEMP/data"
          xvfb-run -a -s "-screen 0 1280x800x24" ./target/release/decdrm-gui "$RUNNER_TEMP/drm.wav" --start --no-audio --config "$RUNNER_TEMP/gui.toml" --exit-after 8 --screenshot "$RUNNER_TEMP/gui.png"
          test -s "$RUNNER_TEMP/gui.png"
      - name: GUI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshot
          path: ${{ runner.temp }}/gui.png
          if-no-files-found: warn
      - name: EnCodec feature (candle; model tests skip without weights)
        run: |
          cargo build --release -p decdrm-cli -p decdrm-gui --features decdrm-cli/encodec,decdrm-gui/encodec
          cargo test --release -p decdrm-encodec -p decdrm-station --features decdrm-encodec/encodec,decdrm-station/encodec
