[package]
name = "decdrm-dac"
description = "DAC (Descript Audio Codec, 24 kHz) as DecDRM's neural audio codec extension: DRM framing, CRCs, concealment and SDC signalling; streaming CPU inference (candle) behind the `dac` feature"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# The codec itself: streaming DAC inference with candle on the CPU, the encoder and the
# `decdrm_codecs::DrmAudioDecoder` implementation. Off by default because candle is a
# large dependency; without it the crate still plans, frames, deframes and signals DAC
# services (so receivers can name them and transmitters can validate them).
dac = ["dep:candle-core", "dep:decdrm-codecs", "dep:rayon"]
# Build the weights (299 MB) into the executable, used when no weights file is found:
# for single-file portable builds (`scripts/build-portable.ps1`). Needs the weights at
# build time, in `$DECDRM_MODELS` or the workspace's `models` directory
# (`decdrm models download dac`).
embed-weights = ["dac"]

[dependencies]
thiserror.workspace = true
# 0.9 rather than 0.10/0.11: those pull in `tokenizers` (with the Oniguruma C library)
# unconditionally, which DAC does not need.
candle-core = { version = "0.9.1", optional = true }
decdrm-codecs = { path = "../decdrm-codecs", optional = true }
# The elementwise layers (Snake activations, biases, residual sums) and the
# convolutions' input matrices as parallel passes; candle's own run on one thread.
rayon = { version = "1.12", optional = true }

[dev-dependencies]
# CRC cross-check and the SDC type 9 round trip.
decdrm-core = { path = "../decdrm-core" }
# Spectra for the quality measurements of the model tests.
rustfft.workspace = true

[[test]]
name = "codec"
required-features = ["dac"]

[[example]]
name = "dac_rtf"
required-features = ["dac"]

[[example]]
name = "dac_errors"
required-features = ["dac"]
