[package]
name = "decdrm-io"
description = "Audio file and sound-card I/O plus resampling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Decoding: only the WAV/FLAC demuxers and the PCM/FLAC decoders.
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "flac", "pcm"] }
# Asynchronous (adjustable-ratio) sinc resampler.
rubato = "5.0.0"
# Sound cards: WASAPI on Windows, ALSA on Linux (no optional hosts, so only libasound2-dev is
# needed to build on Linux). "realtime" promotes the audio callback threads to real-time
# (MMCSS) priority on Windows so a busy CPU cannot starve them; on Linux it is a no-op unless
# "realtime-dbus" (which needs libdbus-1-dev) is enabled.
cpal = { version = "0.18.2", features = ["realtime"] }
# WAV writing.
hound = "3.5.1"
# FLAC encoding; the default "par"/"serde"/"log" features are not needed.
flacenc = { version = "0.5.1", default-features = false }
# Lock-free single-producer/single-consumer ring buffer for the audio callbacks.
rtrb = "0.3.5"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
