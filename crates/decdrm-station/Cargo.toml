[package]
name = "decdrm-station"
description = "DecDRM transmitter application layer: station configuration, multiplex planning and the frame loop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Encode DecDRM's experimental EnCodec services (neural codec; pulls in candle). Without
# it such configurations are recognised but rejected ("not built in"). The receiving
# engine of the loopback tests gets it too.
encodec = ["decdrm-encodec/encodec", "decdrm-engine/encodec"]

[dependencies]
decdrm-core = { path = "../decdrm-core" }
decdrm-codecs = { path = "../decdrm-codecs" }
decdrm-data = { path = "../decdrm-data" }
decdrm-encodec = { path = "../decdrm-encodec" }
decdrm-io = { path = "../decdrm-io" }
# Station configuration files (same versions as the GUI's settings file).
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1"
# Journaline page files may also be written as JSON.
serde_json = "1"
thiserror.workspace = true
# Web stream input: MP3/MP2 and Vorbis/FLAC decoders (the same symphonia as decdrm-io's
# WAV/FLAC reader; the stream framing and the Ogg demuxer are DecDRM's own).
symphonia = { version = "0.6.1", default-features = false, features = ["mp1", "mp2", "mp3", "vorbis", "flac"] }
# Web stream input over HTTPS: TLS with the ring crypto provider (no CMake/NASM needed)
# and the operating system's trusted root certificates.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
# The receiver session decodes the loopback tests' output.
decdrm-engine = { path = "../decdrm-engine" }
# Small JPEG/PNG slides for the slideshow loopback test.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
tempfile = "3"
# FLAC streams for the web stream tests (the encoder decdrm-io writes FLAC files with).
flacenc = { version = "0.5.1", default-features = false }
