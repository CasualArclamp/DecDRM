# Journaline pages for examples/station.toml.
#
# Page 0 is the root menu. A page has at most one of `menu` (links to other pages),
# `text` (plain text; "\n" breaks lines) and `list` (rows: a string, or an array of
# cells); with none of them it is a title-only page.

[[page]]
id = 0
title = "DecDRM News"
menu = [
    { link = 1, text = "Headlines" },
    { link = 2, text = "Weather" },
    { link = 3, text = "Frequencies" },
]

[[page]]
id = 1
title = "Headlines"
text = "DecDRM transmits DRM30 from a TOML file.\nAudio, text, slideshow, Journaline and EPG."

[[page]]
id = 2
title = "Weather"
list = [["Today", "Sunny, 21 C"], ["Tomorrow", "Clouds, 18 C"]]

[[page]]
id = 3
title = "Tune in on 6.070 MHz"
