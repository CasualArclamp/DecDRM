[package]
name = "decdrm-engine"
description = "Runtime wiring of the DecDRM receiver: input sources, decoding pipelines, status snapshots"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Decode DecDRM's experimental EnCodec services (neural codec; pulls in candle). Without
# it they are recognised and reported as "EnCodec (not built in)".
encodec = ["decdrm-encodec/encodec"]
# Decode EVS audio sent in a data application (KCBS on 6140 kHz) with the 3GPP
# reference decoder, built from the source zip in `reference/evs/` (see decdrm-evs).
# Without it such audio is recognised and reported as not decodable.
evs = ["decdrm-evs/decoder"]

[dependencies]
decdrm-core = { path = "../decdrm-core" }
decdrm-io = { path = "../decdrm-io" }
decdrm-data = { path = "../decdrm-data" }
decdrm-codecs = { path = "../decdrm-codecs" }
decdrm-encodec = { path = "../decdrm-encodec" }
decdrm-evs = { path = "../decdrm-evs" }
crossbeam-channel = "0.5"
anyhow.workspace = true
tracing.workspace = true
