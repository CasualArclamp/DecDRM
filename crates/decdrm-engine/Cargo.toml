[package]
name = "decdrm-engine"
description = "Runtime wiring of the DecDRM receiver: input sources, decoding pipelines, status snapshots"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Decode DecDRM's experimental EnCodec services (neural codec; pulls in candle). Without
# it they are recognised and reported as "EnCodec (not built in)".
encodec = ["decdrm-encodec/encodec"]

[dependencies]
decdrm-core = { path = "../decdrm-core" }
decdrm-io = { path = "../decdrm-io" }
decdrm-data = { path = "../decdrm-data" }
decdrm-codecs = { path = "../decdrm-codecs" }
decdrm-encodec = { path = "../decdrm-encodec" }
decdrm-evs = { path = "../decdrm-evs" }
decdrm-kiwi = { path = "../decdrm-kiwi" }
crossbeam-channel = "0.5"
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
# Temporary folders for the recording tests.
tempfile = "3"
