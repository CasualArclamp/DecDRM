[package]
name = "decdrm-cli"
description = "DecDRM command-line receiver and transmitter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "decdrm"
path = "src/main.rs"

[features]
# DecDRM's DAC codec (neural) in the receiver and the transmitter (pulls in candle):
# `cargo build --release -p decdrm-cli --features dac`. The weights are fetched with
# `decdrm models download dac` (available in every build).
dac = ["decdrm-engine/dac", "decdrm-station/dac"]
# DAC with its weights built in (a single-file executable, 299 MB more; see
# `scripts/build-portable.ps1`).
embed-weights = ["dac", "decdrm-dac/embed-weights"]

[dependencies]
decdrm-engine = { path = "../../crates/decdrm-engine" }
decdrm-dac = { path = "../../crates/decdrm-dac" }
decdrm-io = { path = "../../crates/decdrm-io" }
decdrm-schedule = { path = "../../crates/decdrm-schedule" }
decdrm-station = { path = "../../crates/decdrm-station" }
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
anyhow.workspace = true
