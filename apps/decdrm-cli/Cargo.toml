[package]
name = "decdrm-cli"
description = "DecDRM command-line receiver and transmitter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "decdrm"
path = "src/main.rs"

[features]
# DecDRM's experimental EnCodec codec in the receiver and the transmitter (pulls in
# candle): `cargo build --release -p decdrm-cli --features encodec`. The weights are
# fetched with `decdrm models download encodec` (available in every build).
encodec = ["decdrm-engine/encodec", "decdrm-station/encodec"]
# EVS audio sent as data (KCBS on 6140 kHz), decoded with the 3GPP reference decoder
# built from the zip in `reference/evs/` (see crates/decdrm-evs; private use).
evs = ["decdrm-engine/evs"]
# EnCodec with its weights built in (a single-file executable, 93 MB more; see
# `scripts/build-portable.ps1`).
embed-weights = ["encodec", "decdrm-encodec/embed-weights"]

[dependencies]
decdrm-engine = { path = "../../crates/decdrm-engine" }
decdrm-encodec = { path = "../../crates/decdrm-encodec" }
decdrm-io = { path = "../../crates/decdrm-io" }
decdrm-schedule = { path = "../../crates/decdrm-schedule" }
decdrm-station = { path = "../../crates/decdrm-station" }
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
anyhow.workspace = true
